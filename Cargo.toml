[workspace]
members = [
  "crates/zones-core",
  "crates/zones-config",
  "crates/zones-niri",
  "crates/zones-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }
niri-ipc = "=26.4.0"
proptest = "1.6"
