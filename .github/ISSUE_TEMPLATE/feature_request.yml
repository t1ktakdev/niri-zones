name: Feature request
description: Suggest an improvement for niri-zones
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: input
    attributes:
      label: Does this require global input interception?
      options:
        - "No"
        - "Not sure"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
